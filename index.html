<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Навигатор по ВУЗу</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a6fa5">
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Карта -->
        <div class="map-container" id="mapContainer">
            <div class="map-grid" id="mapGrid"></div>
            <div class="map-content" id="mapContent"></div>
        </div>
        
        <!-- Индикатор перемещения -->
        <div class="move-indicator" id="moveIndicator">Перемещайте карту пальцем</div>
        
        <!-- Информация о маршруте -->
        <div class="route-info" id="routeInfo">
            <div class="route-header">
                <div class="route-title">Маршрут построен</div>
                <button class="close-btn" id="closeRouteInfo">×</button>
            </div>
            <div class="route-details">
                <div class="route-detail">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2"/>
                        <path d="M12 8V12L14 14" stroke-width="2"/>
                    </svg>
                    <span>От: <span id="routeFrom">-</span></span>
                </div>
                <div class="route-detail">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" stroke-width="2"/>
                        <circle cx="12" cy="10" r="3" stroke-width="2"/>
                    </svg>
                    <span>До: <span id="routeTo">-</span></span>
                </div>
            </div>
            <div class="route-stats">
                <div class="stat-item">
                    <div class="stat-value" id="routeDistance">-</div>
                    <div class="stat-label">Расстояние</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="routeTime">-</div>
                    <div class="stat-label">Время</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="routeFloor">1</div>
                    <div class="stat-label">Этаж</div>
                </div>
            </div>
        </div>
        
        <!-- Селектор корпусов -->
        <div class="building-selector">
            <div class="building-btn" id="buildingBtn">
                <span id="currentBuilding">Корпус А</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M6 9L12 15L18 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="building-dropdown" id="buildingDropdown">
                <div class="building-option active" data-building="A">Корпус А</div>
                <div class="building-option" data-building="B">Корпус Б</div>
                <div class="building-option" data-building="V">Корпус В</div>
                <div class="building-option" data-building="G">Корпус Г</div>
                <div class="building-option" data-building="D">Корпус Д</div>
            </div>
        </div>
        
        <!-- ПОИСК ВНИЗУ (обычный режим) -->
        <div class="search-container">
            <div class="search-box" id="searchTrigger">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21L16.65 16.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="search-placeholder">Поиск кабинетов...</div>
            </div>
        </div>
        
        <!-- Быстрое построение маршрута -->
        <div class="route-btn" id="quickRouteBtn">
            <svg class="route-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
        </div>
        
        <!-- Масштаб карты -->
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomIn">+</button>
            <button class="zoom-btn" id="zoomOut">-</button>
        </div>
        
        <!-- Переключение этажей -->
        <div class="floor-controls">
            <div class="floor-btn" data-floor="5">5</div>
            <div class="floor-btn" data-floor="4">4</div>
            <div class="floor-btn" data-floor="3">3</div>
            <div class="floor-btn" data-floor="2">2</div>
            <div class="floor-btn active" data-floor="1">1</div>
        </div>
        
        <!-- Окно информации о точке -->
        <div class="point-info" id="pointInfo">
            <div class="point-header">
                <div class="point-title" id="pointTitle">Кабинет 101</div>
                <button class="close-btn" id="closePointInfo">×</button>
            </div>
            <div class="point-details">
                <div class="point-detail">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/>
                        <path d="M3 9h18" stroke-width="2"/>
                        <path d="M9 21V9" stroke-width="2"/>
                    </svg>
                    <span>Тип: <span id="pointType">Кабинет</span></span>
                </div>
                <div class="point-detail">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 8v-4h1v4m3-4v4" stroke-width="2"/>
                    </svg>
                    <span>Этаж: <span id="pointFloor">1</span></span>
                </div>
                <div class="point-detail">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2"/>
                        <path d="M12 6V12L16 14" stroke-width="2"/>
                    </svg>
                    <span>Время: 8:00-20:00</span>
                </div>
            </div>
            <div class="point-buttons">
                <button class="btn btn-secondary" id="setAsStartPoint">Отсюда</button>
                <button class="btn btn-primary" id="setAsEndPoint">Сюда</button>
            </div>
        </div>
    </div>
    
    <!-- ПОЛНОЭКРАННЫЙ ПОИСК -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-header">
            <div class="search-input-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21L16.65 16.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input type="text" class="search-input-full" placeholder="Поиск кабинетов..." id="searchInputFull" autocomplete="off">
                <button class="search-close-btn" id="closeSearch">×</button>
            </div>
        </div>
        <div class="search-results" id="searchResults">
            <!-- Результаты поиска будут добавляться динамически -->
        </div>
    </div>

    <script src="scripts/utils.js"></script>
    <script src="scripts/pathfinder.js"></script>
    <script src="scripts/main.js"></script>
