<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Навигатор КубГУ</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a6fa5">
  <link rel="icon" href="icon.jpg">
  <link rel="stylesheet" href="styles/main.css">
<link rel="manifest" href="/kubsu_navigator/manifest.json">
<meta name="theme-color" content="#4a6fa5">
</head>
<body>
  <div class="app-container" id="appContainer">
    <div class="map-container" id="mapContainer">
      <div class="map-surface" id="mapSurface"></div>
    </div>

    <div class="move-indicator" id="moveIndicator">Перемещайте карту пальцем</div>

    <div class="building-selector">
      <div class="building-btn" id="buildingBtn">
        <span id="currentBuilding">Корпус А</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9L12 15L18 9"/></svg>
      </div>
      <div class="building-dropdown" id="buildingDropdown">
        <div class="building-option active" data-building="A">Корпус А</div>
        <div class="building-option" data-building="H">Корпус Н</div>
        <div class="building-option" data-building="L">Корпус Л</div>
      </div>
    </div>

    <div class="search-container">
      <div class="search-box" id="searchTrigger">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle r="9" cx="11" cy="11"/><path d="M21 21L16.65 16.65"/></svg>
        <div class="search-placeholder">Поиск кабинетов...</div>
      </div>
    </div>

    <div class="route-btn" id="quickRouteBtn">
      <svg class="route-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">-</button>
    </div>

    <div class="floor-controls">
      <div class="floor-btn" data-floor="5">5</div>
      <div class="floor-btn" data-floor="4">4</div>
      <div class="floor-btn" data-floor="3">3</div>
      <div class="floor-btn" data-floor="2">2</div>
      <div class="floor-btn active" data-floor="1">1</div>
    </div>

    <div class="point-info" id="pointInfo">
      <div class="point-header">
        <div class="point-title" id="pointTitle">Кабинет 101</div>
        <button class="close-btn" id="closePointInfo">×</button>
      </div>
      <div class="point-details">
        <div class="point-detail">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span>Тип: <span id="pointType">Кабинет</span></span>
        </div>
        <div class="point-detail">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 8v-4h1v4m3-4v4" stroke-width="2"/></svg>
          <span>Этаж: <span id="pointFloor">1</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="search-overlay" id="searchOverlay">
    <div class="search-header">
      <div class="search-input-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle r="9" cx="11" cy="11"/><path d="M21 21L16.65 16.65"/></svg>
        <input type="text" class="search-input-full" placeholder="Поиск кабинетов..." id="searchInputFull" autocomplete="off">
        <button class="search-close-btn" id="closeSearch">×</button>
      </div>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <script type="module" src="scripts/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/kubsu_navigator/sw.js', {
      scope: '/kubsu_navigator/' // Укажите область действия
    });
  }
</script>

</body>
</html>
